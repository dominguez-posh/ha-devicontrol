set_program:
  target:
    entity:
      integration: kermi_ecotimer
      domain: climate
  fields:
    days:
      required: true
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    base_mode:
      default: eco
      selector:
        select:
          options:
            - antifreeze
            - eco
            - comfort
    periods:
      example: "[{start: '06:00', end: '08:30', mode: comfort}, {start: '18:00', end: '22:00', mode: comfort}]"
      selector:
        object:
    activate:
      default: true
      selector:
        boolean:
rename:
  target:
    entity:
      integration: kermi_ecotimer
      domain: climate
  fields:
    name:
      required: true
      example: Bad Klein Handtuch Trockner
      selector:
        text:
    device_name:
      example: Bad Klein
      selector:
        text:
write_raw:
  target:
    entity:
      integration: kermi_ecotimer
      domain: climate
  fields:
    patches:
      required: true
      example: "{1: 12, 4: 65}"
      selector:
        object:
